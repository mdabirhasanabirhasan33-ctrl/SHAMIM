<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHORT 6T9 - Watch Video</title>
  <meta name="description" content="Watch trending high-definition short videos on SHORT 6T9">
  <meta property="og:title" content="SHORT 6T9 - Video Stream">
  <meta property="og:description" content="Watch and share short videos on SHORT 6T9">
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --border: #1e293b;
      --primary: #e11d48;
      --primary-hover: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #e11d48, #f59e0b);
      color: white;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 9/16;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .content {
      padding: 1.25rem;
    }
    h1 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    p.desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e11d48, #fb7185);
      color: white;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #2b3952;
    }
    footer {
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand">
      <span class="brand-badge">6T9</span>
      <span>SHORT 6T9</span>
    </a>
    <span style="font-size: 0.85rem; color: #f59e0b; font-weight: 600;">⚡ Video Hub</span>
  </header>

  <div class="container">
    <div class="video-wrapper">
      <video id="player" controls playsinline poster="" src=""></video>
    </div>
    <div class="content">
      <h1 id="video-title">SHORT 6T9 Premiere</h1>
      <p class="desc" id="video-desc">Loading video preview...</p>
      <div class="actions">
        <a id="app-link" href="short6t9://video/default" class="btn btn-primary">
          📱 Open in App
        </a>
        <a id="download-btn" href="#" download class="btn btn-secondary">
          ⬇️ Download MP4
        </a>
      </div>
    </div>
  </div>

  <footer>
    <p>Hosted on Google Cloud Run HTTPS Free Tier with SSL • SHORT 6T9 Platform</p>
  </footer>

  <script>
    // Sample catalog matching Android Database
    const catalog = {
      'vid_6t9_01': {
        title: 'Neon Cyber Drift • 6T9 Special',
        desc: 'High octane night chase through glowing futuristic streets. Full high bitrate video.',
        src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
        poster: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop'
      },
      'vid_6t9_02': {
        title: 'Hyper Speed Escape • Extreme Stunts',
        desc: 'Adrenaline packed parkour and hyper speed action. Pure cinematic visual soundscape.',
        src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
        poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop'
      },
      'vid_6t9_03': {
        title: 'Urban Sunset Meltdown • Ultra 4K',
        desc: 'Golden hour vibes across metropolitan skyscrapers with vibrant synth beats.',
        src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyBlazes.mp4',
        poster: 'https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800&auto=format&fit=crop'
      },
      'vid_6t9_04': {
        title: 'Midnight Quantum Core Meltdown',
        desc: 'Sci-fi VFX showcase of power plant explosion and futuristic mecha warfare.',
        src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4',
        poster: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&auto=format&fit=crop'
      },
      'vid_6t9_05': {
        title: 'Tokyo Underground Beats & Street Life',
        desc: 'Night market neon reflections, rain, and lo-fi hip hop bass.',
        src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4',
        poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop'
      }
    };

    // Extract video ID from URL path or query params
    const pathParts = window.location.pathname.split('/');
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id') || pathParts[pathParts.length - 1] || 'vid_6t9_01';

    const item = catalog[videoId] || catalog['vid_6t9_01'];

    document.getElementById('video-title').textContent = item.title;
    document.getElementById('video-desc').textContent = item.desc;
    const player = document.getElementById('player');
    player.src = item.src;
    player.poster = item.poster;

    document.getElementById('app-link').href = `short6t9://video/${videoId}`;
    const dlBtn = document.getElementById('download-btn');
    dlBtn.href = item.src;
    dlBtn.setAttribute('download', `${item.title}.mp4`);
  </script>
</body>
</html>
